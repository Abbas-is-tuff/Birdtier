<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Birdtier</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#1a1030"/>
      <stop offset="0.6" stop-color="#0a0a18"/>
      <stop offset="1" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23c"/>
      <stop offset="0.45" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#d4145a"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c9d3de"/>
      <stop offset="1" stop-color="#6d7c8d"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fe0ff"/>
      <stop offset="0.5" stop-color="#1569c9"/>
      <stop offset="1" stop-color="#0a1c4a"/>
    </linearGradient>
    <linearGradient id="hawk" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#1f8a2c"/>
      <stop offset="0.6" stop-color="#5fd63a"/>
      <stop offset="1" stop-color="#e6ff4a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b1f"/>
      <stop offset="1" stop-color="#ff8a3c"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="1" stop-color="#d8bf8a"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4656"/>
      <stop offset="1" stop-color="#121820"/>
    </linearGradient>
    <clipPath id="sunclip"><circle cx="256" cy="236" r="206"/></clipPath>
    <clipPath id="ringfront"><rect x="-60" y="256" width="640" height="300"/></clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#fff">
    <circle cx="40" cy="52" r="2.4"/><circle cx="472" cy="44" r="2.8"/><circle cx="486" cy="330" r="2"/>
    <circle cx="26" cy="300" r="1.8"/><circle cx="96" cy="22" r="1.5"/><circle cx="430" cy="110" r="1.4"/>
    <circle cx="60" cy="470" r="1.6"/><circle cx="470" cy="480" r="2"/>
  </g>

  <!-- blazing sun with scan slits -->
  <circle cx="256" cy="236" r="214" fill="#ff5a1f" opacity="0.5" filter="url(#softglow)"/>
  <circle cx="256" cy="236" r="206" fill="url(#sun)"/>
  <g clip-path="url(#sunclip)" fill="#0a0a18">
    <rect x="0" y="300" width="512" height="7"/><rect x="0" y="326" width="512" height="10"/>
    <rect x="0" y="356" width="512" height="13"/><rect x="0" y="390" width="512" height="17"/><rect x="0" y="426" width="512" height="22"/>
  </g>

  <!-- orbit ring, back half -->
  <g transform="rotate(-16 256 290)">
    <ellipse cx="256" cy="290" rx="246" ry="64" fill="none" stroke="#06080e" stroke-width="22"/>
    <ellipse cx="256" cy="290" rx="246" ry="64" fill="none" stroke="#7df0ff" stroke-width="10"/>
  </g>

  <g stroke="#06080e" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- armored suit -->
    <path d="M150 346 L252 326 L336 344 L384 398 L420 520 L70 520 L104 402 Z" fill="url(#armor)"/>
    <path d="M128 392 L250 360 L366 390 L374 418 L250 388 L122 420 Z" fill="#ff7a1f"/>
    <path d="M214 440 L250 470 L286 440 L286 468 L250 500 L214 468 Z" fill="#7df0ff"/>

    <!-- mohawk -->
    <path d="M318 112 L300 26 L270 100 L236 22 L226 104 L172 40 L184 124 L116 82 L150 158 L72 142 L128 204 L58 220 L132 256 L200 180 Z" fill="url(#hawk)"/>

    <!-- face under the visor -->
    <path d="M222 262 L404 258 C400 300 372 332 332 346 L250 330 Z" fill="url(#face)"/>

    <!-- helmet shell -->
    <path d="M138 300 C116 196 170 108 272 104 C344 100 396 140 408 198 L240 198 L222 264 L252 330 L158 350 Z" fill="url(#shell)"/>
  </g>
  <!-- helmet stripe and details -->
  <path d="M166 318 C148 222 196 146 274 138 C330 134 368 156 386 194" fill="none" stroke="#ff5a1f" stroke-width="18"/>
  <path d="M190 314 C176 236 214 174 276 166 C316 162 344 176 358 196" fill="none" stroke="#06080e" stroke-width="5" opacity="0.55"/>
  <circle cx="196" cy="300" r="20" fill="#2a3442" stroke="#06080e" stroke-width="7"/>
  <circle cx="196" cy="300" r="7" fill="#7df0ff"/>

  <!-- visor -->
  <path d="M240 198 L408 198 C416 222 414 244 404 260 L222 264 Z" fill="url(#visor)" stroke="#06080e" stroke-width="8" stroke-linejoin="round"/>
  <path d="M254 208 L330 208 L310 228 L250 228 Z" fill="#fff" opacity="0.45"/>
  <path d="M344 208 L362 208 L342 228 L324 228 Z" fill="#fff" opacity="0.3"/>
  <!-- glowing angry eye behind the visor -->
  <path d="M316 224 L392 238 L384 252 C364 258 336 252 322 240 Z" fill="#ffd23c" filter="url(#glow)"/>
  <path d="M316 224 L392 238 L384 252 C364 258 336 252 322 240 Z" fill="#fff6c8"/>
  <path d="M352 232 L376 237 L371 249 C362 250 354 246 350 240 Z" fill="#06080e"/>

  <!-- hooked beak -->
  <g stroke="#06080e" stroke-width="8" stroke-linejoin="round">
    <path d="M368 300 C384 314 402 318 416 324 C420 344 404 358 386 354 C372 344 364 322 368 300 Z" fill="#c9ae76"/>
    <path d="M360 262 C394 232 452 240 470 286 C482 318 466 350 440 370 C442 340 430 320 406 314 C380 306 364 290 360 262 Z" fill="url(#beak)"/>
  </g>
  <path d="M384 262 C410 250 438 258 450 282" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.8"/>

  <!-- orbit ring, front half, with a comet -->
  <g transform="rotate(-16 256 290)">
    <g clip-path="url(#ringfront)">
      <ellipse cx="256" cy="290" rx="246" ry="64" fill="none" stroke="#06080e" stroke-width="22"/>
      <ellipse cx="256" cy="290" rx="246" ry="64" fill="none" stroke="#7df0ff" stroke-width="10"/>
    </g>
    <circle cx="120" cy="343" r="26" fill="#7df0ff" opacity="0.8" filter="url(#glow)"/>
    <circle cx="120" cy="343" r="13" fill="#fff" stroke="#06080e" stroke-width="6"/>
  </g>
</svg>
