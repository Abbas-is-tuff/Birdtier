<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Birdtier</title>
  <defs>
    <radialGradient id="sky" cx="62%" cy="34%" r="80%">
      <stop offset="0" stop-color="#1b3d5a"/>
      <stop offset="0.45" stop-color="#0b1a2a"/>
      <stop offset="1" stop-color="#03060a"/>
    </radialGradient>
    <radialGradient id="planet" cx="70%" cy="20%" r="85%">
      <stop offset="0" stop-color="#2f86c0"/>
      <stop offset="0.55" stop-color="#145079"/>
      <stop offset="1" stop-color="#061827"/>
    </radialGradient>
    <radialGradient id="glass" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#e8f6ff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#9fd2ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#9fd2ff" stop-opacity="0.22"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a2e"/>
      <stop offset="1" stop-color="#ff9a5a"/>
    </linearGradient>
    <linearGradient id="feathers" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62c24a"/>
      <stop offset="1" stop-color="#2f8a2c"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf1d6"/>
      <stop offset="1" stop-color="#cdb98f"/>
    </linearGradient>
    <clipPath id="inside"><circle cx="256" cy="238" r="121"/></clipPath>
    <clipPath id="front"><rect x="-40" y="256" width="600" height="300"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- deep space -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="62" cy="70" r="2.6" opacity="0.9"/><circle cx="128" cy="38" r="1.6" opacity="0.6"/>
    <circle cx="420" cy="58" r="2.2" opacity="0.85"/><circle cx="470" cy="140" r="1.5" opacity="0.6"/>
    <circle cx="452" cy="300" r="2" opacity="0.7"/><circle cx="36" cy="200" r="1.5" opacity="0.55"/>
    <circle cx="96" cy="140" r="1.2" opacity="0.5"/><circle cx="360" cy="24" r="1.4" opacity="0.6"/>
    <circle cx="486" cy="420" r="1.6" opacity="0.55"/><circle cx="388" cy="470" r="1.2" opacity="0.5"/>
  </g>

  <!-- home planet rising at the bottom -->
  <circle cx="150" cy="700" r="330" fill="url(#planet)"/>
  <path d="M-10 420 C40 400 70 404 104 420 C132 433 150 428 176 414 C150 446 112 452 70 446 C40 442 10 452 -10 460 Z" fill="#4c9a4a" opacity="0.85"/>
  <path d="M230 452 C262 440 300 444 330 462 C300 470 268 474 240 470 Z" fill="#4c9a4a" opacity="0.7"/>
  <circle cx="150" cy="700" r="330" fill="none" stroke="#7cc8ff" stroke-width="7" opacity="0.55"/>

  <!-- orbit, back half (behind the helmet) -->
  <g transform="rotate(-18 256 256)">
    <ellipse cx="256" cy="256" rx="214" ry="66" fill="none" stroke="#f0a43c" stroke-width="12" opacity="0.45"/>
  </g>

  <!-- bird astronaut: a peach-faced lovebird in profile, inside the helmet -->
  <g clip-path="url(#inside)">
    <rect x="120" y="100" width="280" height="280" fill="#0a1824" opacity="0.55"/>
    <ellipse cx="236" cy="372" rx="128" ry="82" fill="url(#feathers)"/>
    <ellipse cx="300" cy="372" rx="62" ry="58" fill="#8fd16a" opacity="0.55"/>
    <circle cx="246" cy="232" r="84" fill="url(#feathers)"/>
    <ellipse cx="286" cy="226" rx="60" ry="66" fill="url(#face)"/>
    <ellipse cx="292" cy="182" rx="38" ry="18" fill="#e8301f" opacity="0.6"/>
    <circle cx="294" cy="206" r="17" fill="#ffffff" opacity="0.85"/>
    <circle cx="295" cy="206" r="12" fill="#101010"/>
    <circle cx="299" cy="201" r="4.2" fill="#ffffff"/>
    <!-- chunky hooked parrot beak: upper mandible curls down over a small lower mandible -->
    <path d="M318 200 C340 190 368 198 380 222 C390 242 384 266 366 280 C364 266 358 256 346 252 C334 248 322 244 316 232 C312 222 312 208 318 200 Z" fill="url(#beak)"/>
    <path d="M318 240 C330 248 342 252 350 260 C354 270 350 280 340 282 C326 280 316 268 314 254 Z" fill="#c9b384"/>
    <path d="M330 206 C346 204 358 210 364 220" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <!-- suit collar -->
    <path d="M128 318 C190 290 300 288 372 318 L372 342 C300 314 190 316 128 344 Z" fill="#e9eef3"/>
    <rect x="234" y="300" width="40" height="16" rx="4" fill="#f0a43c"/>
  </g>

  <!-- helmet glass and rim -->
  <circle cx="256" cy="238" r="121" fill="url(#glass)"/>
  <path d="M168 186 C184 150 214 128 252 122" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <path d="M164 214 C165 206 166 200 168 196" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.45"/>
  <circle cx="256" cy="238" r="124" fill="none" stroke="#dfe9f2" stroke-width="11"/>
  <circle cx="256" cy="238" r="131" fill="none" stroke="#5f7d96" stroke-width="3" opacity="0.8"/>

  <!-- orbit, front half (in front of the helmet) with a spacecraft riding it -->
  <g transform="rotate(-18 256 256)">
    <ellipse cx="256" cy="256" rx="214" ry="66" fill="none" stroke="#f0a43c" stroke-width="12" clip-path="url(#front)"/>
    <g transform="translate(408 300)">
      <circle r="18" fill="#ffd28a" opacity="0.8" filter="url(#glow)"/>
      <path d="M-36 -2 C-20 -8 -8 -8 4 -6 L4 6 C-8 8 -20 8 -36 2 Z" fill="#ffd28a" opacity="0.75"/>
      <path d="M2 -8 L22 0 L2 8 Z" fill="#ffffff"/>
      <rect x="-8" y="-8" width="12" height="16" rx="3" fill="#ffffff"/>
    </g>
  </g>
</svg>
